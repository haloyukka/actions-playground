name: My 08 Slash Command

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  hello:
    if: startsWith(github.event.comment.body, '/hello') && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const comment = context.payload.comment;
            await github.rest.reactions.createForIssueComment({
              ...context.repo,
              comment_id: comment.id,
              content: "wave",
            });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `こんにちは、@${comment.user.login} さん！`,
            });
