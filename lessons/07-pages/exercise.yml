name: My 07 Deploy Pages

on:
  workflow_dispatch:
  # TODO: main への push で、site/** が変わったときも動かす

permissions:
  contents: read
  # TODO: Pages デプロイに必要な2つの権限

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build_site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: TODO # ビルド結果のフォルダ

  deploy:
    # TODO: build の後に動かす
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
