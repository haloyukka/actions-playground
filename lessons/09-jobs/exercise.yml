name: My 09 Pipeline

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - run: seq 1 $(( RANDOM % 100 + 1 )) > lines.txt
      # TODO: lines.txt を "lines" という名前の artifact としてアップロード

  count:
    # TODO: generate の後に動かす
    runs-on: ubuntu-latest
    # TODO: ステップ出力 lines をジョブ出力 lines として公開
    steps:
      # TODO: artifact "lines" をダウンロード
      - id: c
        run: echo "lines=$(wc -l < lines.txt)" >> "$GITHUB_OUTPUT"
      - run: echo "行数は ${{ steps.c.outputs.lines }}"
      - name: 50行より多ければ失敗
        # TODO: 条件を書く
        run: exit 1

  notify:
    needs: count
    # TODO: count が失敗したときだけ
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::行数が多すぎました (TODO count の出力を表示)"
