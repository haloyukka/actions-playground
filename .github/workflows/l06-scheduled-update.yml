# Lesson 06: 定期実行でファイルを自動更新してコミット
name: L06 Scheduled Update

on:
  schedule:
    - cron: "17 0 * * *" # UTC 00:17 = 日本時間 09:17 に毎日
  workflow_dispatch:

permissions:
  contents: write # コミットを push するために必要

concurrency:
  group: scheduled-update # 同時に2つ走らないようにする
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: STATUS.md を生成
        run: python scripts/update_status.py

      - name: 変更があればコミット
        run: |
          if git diff --quiet; then
            echo "変更なし。コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/STATUS.md
          git commit -m "chore: update STATUS.md [skip ci]"
          git push
