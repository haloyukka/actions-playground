# Lesson 07: ビルドして GitHub Pages にデプロイ
# 事前準備: Settings → Pages → Build and deployment → Source を "GitHub Actions" に
name: L07 Deploy Pages

on:
  workflow_dispatch:
  # 課題で push トリガーを足してみよう

permissions:
  contents: read
  pages: write # Pages へのデプロイ
  id-token: write # デプロイ時の本人確認(OIDC)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: ビルド
        run: node scripts/build_site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build # build が成功してから
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
