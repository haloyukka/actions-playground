# Lesson 04: Node.js の CI（Lint + テスト）
name: L04 Node CI

on:
  push:
    branches: [main]
    paths: ["node/**", ".github/workflows/l04-node-ci.yml"]
  pull_request:
    paths: ["node/**", ".github/workflows/l04-node-ci.yml"]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: 依存をインストール（lockファイル通り）
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: テスト (node --test)
        run: npm test
